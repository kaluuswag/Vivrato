name: Build Vivrato VST3

on: [push, workflow_dispatch]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show files
        run: Get-ChildItem -Recurse -Name
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Vivrato-VST3-Windows
          path: build/Vivrato_artefacts/Release/VST3/Vivrato.vst3
